# =============================================================================
# State Globals
# =============================================================================

globals:
  - id: remote_sleeping
    type: bool
    initial_value: "false"
  - id: weather_last_update
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: touch_active
    type: bool
    initial_value: "false"
  - id: touch_start_x
    type: int
    initial_value: "-1"
  - id: touch_start_y
    type: int
    initial_value: "-1"
  - id: touch_started_ms
    type: uint32_t
    initial_value: "0"
  - id: touch_last_repeat_ms
    type: uint32_t
    initial_value: "0"
  - id: touch_repeat_cmd
    type: int
    initial_value: "0" # 1=Up, 2=Down, 3=Left, 4=Right, 5=Center

# =============================================================================
# Action Scripts (Shield & Denon)
# =============================================================================

script:
  - id: beep_hello
    then:
      # Note 1: C6 (~1047 Hz)
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 1047Hz
      - light.turn_on:
          id: buzzer
          brightness: 20%
      - delay: 60ms
      - light.turn_off: buzzer
      - delay: 30ms

      # Note 2: E6 (~1319 Hz)
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 1319Hz
      - light.turn_on:
          id: buzzer
          brightness: 25%
      - delay: 60ms
      - light.turn_off: buzzer
      - delay: 30ms

      # Note 3: G6 (~1568 Hz)
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 1568Hz
      - light.turn_on:
          id: buzzer
          brightness: 30%
      - delay: 60ms
      - light.turn_off: buzzer
      - delay: 30ms

      # Reset base frequency back to default tap tone
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 1200Hz

  - id: beep_tap
    then:
      - light.turn_on:
          id: buzzer
          brightness: 15%
      - delay: 18ms
      - light.turn_off: buzzer

  - id: beep_double
    then:
      - light.turn_on:
          id: buzzer
          brightness: 20%
      - delay: 35ms
      - light.turn_off: buzzer
      - delay: 40ms
      - light.turn_on:
          id: buzzer
          brightness: 20%
      - delay: 35ms
      - light.turn_off: buzzer

  # Sleep Remote + Turn Off Devices
  - id: act_power_off_and_sleep
    then:
      - script.execute: beep_double
      - lambda: "id(remote_sleeping) = true;"
      - if:
          condition:
            lambda: |-
              const auto now = id(rtc_time).now();
              return now.is_valid() &&
                     (id(weather_last_update) == 0 ||
                      now.timestamp - id(weather_last_update) >= 12 * 60 * 60);
          then:
            - homeassistant.action:
                action: homeassistant.update_entity
                data:
                  entity_id: ${weather_forecast_entity}
            - delay: 5s
            - lambda: |-
                const auto now = id(rtc_time).now();
                if (now.is_valid()) id(weather_last_update) = now.timestamp;
      - component.update: epaper_display
      - if:
          condition:
            lambda: "return id(shield_is_on).state;"
          then:
            - homeassistant.action:
                action: remote.turn_off
                data:
                  entity_id: ${shield_entity}
      - if:
          condition:
            lambda: "return id(denon_is_on).state;"
          then:
            - homeassistant.action:
                action: media_player.turn_off
                data:
                  entity_id: ${denon_entity}
      - delay: 3000ms
      - deep_sleep.enter: sticky_deep_sleep

  # Shield Commands
  - id: shield_cmd
    parameters:
      cmd: string
    then:
      - script.execute: beep_tap
      - logger.log:
          format: "Executing Shield Command: %s"
          args: [cmd.c_str()]
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: ${shield_entity}
          data_template:
            command: !lambda "return cmd;"

  - id: shield_hold_cmd
    parameters:
      cmd: string
      secs: string
    then:
      - script.execute: beep_double
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: ${shield_entity}
          data_template:
            command: !lambda "return cmd;"
            hold_secs: !lambda "return secs;"

  # Denon Controls
  - id: denon_vol_up
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: ${denon_entity}

  - id: denon_vol_down
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: ${denon_entity}

  - id: denon_mute
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: ${denon_entity}
          data_template:
            is_volume_muted: !lambda "return !id(denon_muted).state;"

  # App Launching
  - id: launch_app
    parameters:
      activity: string
    then:
      - script.execute: beep_tap
      - logger.log:
          format: "Launching Shield Activity: %s"
          args: [activity.c_str()]
      - homeassistant.action:
          action: remote.turn_on
          data:
            entity_id: ${shield_entity}
            activity: !lambda |-
              return activity;

# =============================================================================
# Sensors & Trackers
# =============================================================================

time:
  - platform: pcf8563
    i2c_id: sensor_i2c
    id: rtc_time
    address: 0x51
    update_interval: never
  - platform: homeassistant
    on_time_sync:
      then:
        - pcf8563.write_time:

sensor:
  - platform: homeassistant
    id: denon_volume
    entity_id: ${denon_entity}
    attribute: volume_level
    # on_value:
    #   then:
    #     - component.update: epaper_display

  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    update_interval: 300s
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(sensor_i2c).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      uint16_t val = static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8);
      return (val > 100) ? NAN : static_cast<float>(val);

text_sensor:
  - platform: homeassistant
    id: weather_forecast
    entity_id: ${weather_forecast_entity}
    attribute: forecast
    internal: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("weather", "Forecast payload received (%u chars): %s",
                     static_cast<unsigned>(x.size()), x.c_str());

binary_sensor:
  - platform: homeassistant
    id: shield_is_on
    entity_id: ${shield_entity}

  - platform: homeassistant
    id: denon_is_on
    entity_id: ${denon_entity}

  - platform: homeassistant
    id: denon_muted
    entity_id: ${denon_entity}
    attribute: is_volume_muted
    # on_state:
    #   then:
    #     - component.update: epaper_display

  # Physical Side Buttons
  - platform: gpio
    id: button_up
    name: "Physical Vol Up"
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - script.execute: denon_vol_up
      - delay: 400ms
      - while:
          condition:
            binary_sensor.is_on: button_up
          then:
            - script.execute: denon_vol_up
            - delay: 150ms

  - platform: gpio
    id: button_down
    name: "Physical Vol Down"
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - script.execute: denon_vol_down
      - delay: 400ms
      - while:
          condition:
            binary_sensor.is_on: button_down
          then:
            - script.execute: denon_vol_down
            - delay: 150ms

  - platform: gpio
    id: button_ai_power
    name: "Sleep Button"
    pin:
      number: GPIO4
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - script.execute: act_power_off_and_sleep

deep_sleep:
  id: sticky_deep_sleep
  wakeup_pin:
    number: GPIO4
    allow_other_uses: true
    inverted: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: KEEP_AWAKE

# Repeat-while-held interval for on-screen touch D-Pad
interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(touch_active) || id(touch_repeat_cmd) == 0) return;
          const uint32_t now = millis();
          if ((now - id(touch_started_ms)) < 450 || (now - id(touch_last_repeat_ms)) < 150) return;
          id(touch_last_repeat_ms) = now;

          switch (id(touch_repeat_cmd)) {
            case 1: id(shield_cmd).execute("DPAD_UP"); break;
            case 2: id(shield_cmd).execute("DPAD_DOWN"); break;
            case 3: id(shield_cmd).execute("DPAD_LEFT"); break;
            case 4: id(shield_cmd).execute("DPAD_RIGHT"); break;
            case 5: id(shield_cmd).execute("DPAD_CENTER"); break;
          }

# =============================================================================
# E-Paper Canvas Rendering (480 x 800 Portrait)
# =============================================================================

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-Sticky
    spi_id: display_spi
    rotation: 90
    update_interval: never
    full_update_every: 1
    lambda: |-
      const auto black = Color(0, 0, 0);
      const auto white = Color(255, 255, 255);
      const int w = it.get_width();
      const int h = it.get_height();

      // Rounded rectangle drawing helpers
      auto fill_rounded_rect = [&](int x, int y, int width, int height, int radius, Color color) {
        const int r = std::min(radius, std::min(width, height) / 2);
        it.filled_rectangle(x + r, y, width - 2 * r, height, color);
        it.filled_rectangle(x, y + r, width, height - 2 * r, color);
        it.filled_circle(x + r, y + r, r, color);
        it.filled_circle(x + width - r - 1, y + r, r, color);
        it.filled_circle(x + r, y + height - r - 1, r, color);
        it.filled_circle(x + width - r - 1, y + height - r - 1, r, color);
      };

      auto rounded_rect = [&](int x, int y, int width, int height, int radius) {
        fill_rounded_rect(x, y, width, height, radius, black);
        fill_rounded_rect(x + 2, y + 2, width - 4, height - 4, std::max(0, radius - 2), white);
      };

      it.fill(white);
      it.rectangle(0, 0, w, h, black);

      if (id(remote_sleeping)) {
        it.printf(460, 16, id(font_md), black, TextAlign::TOP_RIGHT, "Sleeping... Press to wake.");
        it.image(0, 0, id(sleep_note), ImageAlign::TOP_LEFT, black, white);
        const int base_fc_y = 88;
        it.printf(16, base_fc_y, id(font_lg), black, TextAlign::TOP_LEFT, "Weather Forecast");
        it.horizontal_line(16, base_fc_y + 48, 320, black);
        it.printf(16, base_fc_y + 56, id(font_md), black, TextAlign::TOP_LEFT, "TIME");
        it.printf(88, base_fc_y + 56, id(font_md), black, TextAlign::TOP_LEFT, "TEMP");
        it.printf(168, base_fc_y + 60, id(font_xs), black, TextAlign::TOP_LEFT, "HUMIDITY");
        it.printf(270, base_fc_y + 60, id(font_xs), black, TextAlign::TOP_LEFT, "CONDITION");
        it.horizontal_line(16, base_fc_y + 86, 448, black);

        const int first_forecast_y = base_fc_y + 98;
        const int row_height = 52;
        const int max_rows = 13;
        const int forecast_hours = 24;
        const int hour_step = (forecast_hours + max_rows - 1) / max_rows;
        const int row_count = (forecast_hours + hour_step - 1) / hour_step;
        const std::string &forecast_json = id(weather_forecast).state;

        ESP_LOGI("weather", "Rendering forecast: payload length=%u, has_state=%s",
                 static_cast<unsigned>(forecast_json.size()),
                 forecast_json.empty() ? "false" : "true");
        if (!forecast_json.empty()) {
          auto forecast_doc = json::parse_json(forecast_json);
          JsonArray forecast = forecast_doc.as<JsonArray>();
          ESP_LOGI("weather", "Forecast JSON parsed: %u entries, displaying up to %d rows",
                   static_cast<unsigned>(forecast.size()), row_count);
          for (int row = 0; row < row_count; row++) {
            const int forecast_index = row * hour_step;
            if (forecast_index >= forecast.size()) {
              ESP_LOGW("weather", "Forecast ended before row %d (index %d)", row, forecast_index);
              break;
            }

            JsonObject entry = forecast[forecast_index];
            const char *datetime = entry["datetime"] | "--";
            const float temperature = entry["temperature"] | NAN;
            const int humidity = entry["humidity"] | -1;
            const char *condition = entry["condition"] | "Unknown";
            const int y = first_forecast_y + row * row_height;

            ESP_LOGI("weather", "Row %d: index=%d datetime=%s temperature=%.1f humidity=%d condition=%s",
                     row, forecast_index, datetime, temperature, humidity, condition);

            // Pre-formatted time string directly from HA (e.g., "6 PM")
            it.printf(16, y, id(font_md), black, TextAlign::TOP_LEFT, "%s", datetime);
            if (isnan(temperature)) {
              it.printf(92, y, id(font_md), black, TextAlign::TOP_LEFT, "-- F");
            } else {
              it.printf(92, y, id(font_md), black, TextAlign::TOP_LEFT, "%.0f F", temperature);
            }
            if (humidity < 0) {
              it.printf(168, y, id(font_md), black, TextAlign::TOP_LEFT, "--%%");
            } else {
              it.printf(168, y, id(font_md), black, TextAlign::TOP_LEFT, "%d%%", humidity);
            }
            it.printf(270, y, id(font_md), black, TextAlign::TOP_LEFT, "%s", condition);
            if (row + 1 < row_count) {
              it.horizontal_line(16, y + row_height - 10, 448, black);
            }
          }
        }
        return;
      }

      // =======================================================================
      // 1. TOP STATUS BAR (Time, Date, Shield/TV State, Battery %)
      // =======================================================================
      auto now = id(rtc_time).now();
      if (now.is_valid()) {
        it.strftime(16, 12, id(font_sm), black, TextAlign::TOP_LEFT, "%H:%M", now);
        it.strftime(75, 13, id(font_xs), black, TextAlign::TOP_LEFT, "%a %b %d", now);
      }

      // On/Off device indicator
      bool tv_on = id(shield_is_on).state;
      it.printf(285, 13, id(font_xs), black, TextAlign::TOP_CENTER, "SHIELD: %s", tv_on ? "ON" : "OFF");

      // Battery level & icon
      int b_pct = !isnan(id(battery_level).state) ? static_cast<int>(id(battery_level).state) : 0;
      it.printf(435, 12, id(font_xs), black, TextAlign::TOP_RIGHT, "%d%%", b_pct);
      it.rectangle(442, 12, 22, 12, black);
      it.filled_rectangle(464, 15, 2, 6, black);
      int b_bar = (18 * b_pct) / 100;
      if (b_bar > 0) it.filled_rectangle(444, 14, b_bar, 8, black);

      it.horizontal_line(16, 36, 448, black);

      // =======================================================================
      // 2. MUTE - UP - HOME
      rounded_rect(${layout_vol_mute_x}, ${layout_vol_mute_y}, ${layout_vol_mute_w}, ${layout_vol_mute_h}, 14);
      it.image(${layout_vol_mute_x} + ${layout_vol_mute_w} / 2, ${layout_vol_mute_y} + ${layout_vol_mute_h} / 2, id(icon_vol_mute), ImageAlign::CENTER, black, white);

      rounded_rect(${layout_dpad_up_x}, ${layout_dpad_up_y}, ${layout_dpad_up_w}, ${layout_dpad_up_h}, 14);
      it.image(${layout_dpad_up_x} + ${layout_dpad_up_w} / 2, ${layout_dpad_up_y} + ${layout_dpad_up_h} / 2, id(icon_up), ImageAlign::CENTER, black, white);

      rounded_rect(${layout_nav_menu_x}, ${layout_nav_menu_y}, ${layout_nav_menu_w}, ${layout_nav_menu_h}, 14);
      it.image(${layout_nav_menu_x} + ${layout_nav_menu_w} / 2, ${layout_nav_menu_y} + ${layout_nav_menu_h} / 2, id(icon_menu), ImageAlign::CENTER, black, white);

      rounded_rect(${layout_nav_home_x}, ${layout_nav_home_y}, ${layout_nav_home_w}, ${layout_nav_home_h}, 14);
      it.image(${layout_nav_home_x} + ${layout_nav_home_w} / 2, ${layout_nav_home_y} + ${layout_nav_home_h} / 2, id(icon_home), ImageAlign::CENTER, black, white);

      // =======================================================================
      // 3. LEFT - SELECT - RIGHT
      // =======================================================================
      rounded_rect(${layout_dpad_left_x}, ${layout_dpad_left_y}, ${layout_dpad_left_w}, ${layout_dpad_left_h}, 14);
      it.image(${layout_dpad_left_x} + ${layout_dpad_left_w} / 2, ${layout_dpad_left_y} + ${layout_dpad_left_h} / 2, id(icon_left), ImageAlign::CENTER, black, white);

      fill_rounded_rect(${layout_dpad_select_x}, ${layout_dpad_select_y}, ${layout_dpad_select_w}, ${layout_dpad_select_h}, 14, black);
      it.image(${layout_dpad_select_x} + ${layout_dpad_select_w} / 2, ${layout_dpad_select_y} + ${layout_dpad_select_h} / 2, id(icon_select), ImageAlign::CENTER, white, black);

      rounded_rect(${layout_dpad_right_x}, ${layout_dpad_right_y}, ${layout_dpad_right_w}, ${layout_dpad_right_h}, 14);
      it.image(${layout_dpad_right_x} + ${layout_dpad_right_w} / 2, ${layout_dpad_right_y} + ${layout_dpad_right_h} / 2, id(icon_right), ImageAlign::CENTER, black, white);

      // 4. SKIP LEFT - DOWN - SKIP RIGHT
      rounded_rect(${layout_skip_left_x}, ${layout_skip_left_y}, ${layout_skip_left_w}, ${layout_skip_left_h}, 14);
      it.image(${layout_skip_left_x} + ${layout_skip_left_w} / 2, ${layout_skip_left_y} + ${layout_skip_left_h} / 2, id(icon_skip_left), ImageAlign::CENTER, black, white);

      rounded_rect(${layout_dpad_down_x}, ${layout_dpad_down_y}, ${layout_dpad_down_w}, ${layout_dpad_down_h}, 14);
      it.image(${layout_dpad_down_x} + ${layout_dpad_down_w} / 2, ${layout_dpad_down_y} + ${layout_dpad_down_h} / 2, id(icon_down), ImageAlign::CENTER, black, white);

      rounded_rect(${layout_skip_right_x}, ${layout_skip_right_y}, ${layout_skip_right_w}, ${layout_skip_right_h}, 14);
      it.image(${layout_skip_right_x} + ${layout_skip_right_w} / 2, ${layout_skip_right_y} + ${layout_skip_right_h} / 2, id(icon_skip_right), ImageAlign::CENTER, black, white);

      // 5. BACK - PLAY/PAUSE
      rounded_rect(${layout_nav_back_x}, ${layout_nav_back_y}, ${layout_nav_back_w}, ${layout_nav_back_h}, 14);
      it.image(${layout_nav_back_x} + ${layout_nav_back_w} / 2, ${layout_nav_back_y} + ${layout_nav_back_h} / 2, id(icon_back), ImageAlign::CENTER, black, white);

      rounded_rect(${layout_nav_play_x}, ${layout_nav_play_y}, ${layout_nav_play_w}, ${layout_nav_play_h}, 14);
      it.image(${layout_nav_play_x} + ${layout_nav_play_w} / 2, ${layout_nav_play_y} + ${layout_nav_play_h} / 2, id(icon_play_pause), ImageAlign::CENTER, black, white);

      it.horizontal_line(${layout_divider_x}, ${layout_divider_y}, ${layout_divider_w}, black);

      // =======================================================================
      // 5. TWO ROWS OF FOUR MEDIA APPS
      // =======================================================================
      // Row 1: YouTube, Jellyfin, Crunchyroll, Prime Video
      // Row 2: Dropout, F1 TV, Max, Disney+
      display::BaseImage* app_logos[8] = {
        id(logo_youtube), id(logo_jellyfin), id(logo_crunchyroll), id(logo_prime),
        id(logo_dropout), id(logo_f1), id(logo_max), id(logo_disney)
      };

      for (int i = 0; i < 8; i++) {
        int col = i % 4;
        int row = i / 4;
        int ax = ${layout_app_x} + col * (${layout_app_w} + ${layout_app_gap_x});
        int ay = ${layout_app_y} + row * (${layout_app_h} + ${layout_app_gap_y});

        rounded_rect(ax, ay, ${layout_app_w}, ${layout_app_h}, 12);
        it.image(ax + (${layout_app_w} / 2), ay + (${layout_app_h} / 2), app_logos[i], ImageAlign::CENTER, black, white);
      }

# =============================================================================
# GT911 Touchscreen Coordinates Mapping
# =============================================================================

touchscreen:
  - platform: gt911
    id: sticky_touch
    display: epaper_display
    i2c_id: touch_i2c
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    transform:
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            const int x = touch.x;
            const int y = touch.y;
            const uint32_t now = millis();

            id(touch_active) = true;
            id(touch_start_x) = x;
            id(touch_start_y) = y;
            id(touch_started_ms) = now;
            id(touch_last_repeat_ms) = now;
            id(touch_repeat_cmd) = 0;

            const char* btn_name = "None";

            // --- Mute - Up - Home ---
            if (x >= ${layout_vol_mute_x} && x <= ${layout_vol_mute_x} + ${layout_vol_mute_w} && y >= ${layout_vol_mute_y} && y <= ${layout_vol_mute_y} + ${layout_vol_mute_h}) {
              btn_name = "VOL_MUTE";
            }
            // --- Full-Width D-Pad Matrix ---
            else if (x >= ${layout_dpad_up_x} && x <= ${layout_dpad_up_x} + ${layout_dpad_up_w} && y >= ${layout_dpad_up_y} && y <= ${layout_dpad_up_y} + ${layout_dpad_up_h}) {
              btn_name = "DPAD_UP";
              id(touch_repeat_cmd) = 1;
              id(shield_cmd).execute("DPAD_UP");
            } else if (x >= ${layout_nav_menu_x} && x <= ${layout_nav_menu_x} + ${layout_nav_menu_w} && y >= ${layout_nav_menu_y} && y <= ${layout_nav_menu_y} + ${layout_nav_menu_h}) {
              btn_name = "NAV_MENU";
            } else if (x >= ${layout_dpad_down_x} && x <= ${layout_dpad_down_x} + ${layout_dpad_down_w} && y >= ${layout_dpad_down_y} && y <= ${layout_dpad_down_y} + ${layout_dpad_down_h}) {
              btn_name = "DPAD_DOWN";
              id(touch_repeat_cmd) = 2;
              id(shield_cmd).execute("DPAD_DOWN");
            } else if (x >= ${layout_dpad_left_x} && x <= ${layout_dpad_left_x} + ${layout_dpad_left_w} && y >= ${layout_dpad_left_y} && y <= ${layout_dpad_left_y} + ${layout_dpad_left_h}) {
              btn_name = "DPAD_LEFT";
              id(touch_repeat_cmd) = 3;
              id(shield_cmd).execute("DPAD_LEFT");
            } else if (x >= ${layout_dpad_right_x} && x <= ${layout_dpad_right_x} + ${layout_dpad_right_w} && y >= ${layout_dpad_right_y} && y <= ${layout_dpad_right_y} + ${layout_dpad_right_h}) {
              btn_name = "DPAD_RIGHT";
              id(touch_repeat_cmd) = 4;
              id(shield_cmd).execute("DPAD_RIGHT");
            } else if (x >= ${layout_dpad_select_x} && x <= ${layout_dpad_select_x} + ${layout_dpad_select_w} && y >= ${layout_dpad_select_y} && y <= ${layout_dpad_select_y} + ${layout_dpad_select_h}) {
              btn_name = "DPAD_CENTER";
              id(touch_repeat_cmd) = 5;
              id(shield_cmd).execute("DPAD_CENTER");
            }
            // --- Skip Left - Down - Skip Right ---
            else if (x >= ${layout_skip_left_x} && x <= ${layout_skip_left_x} + ${layout_skip_left_w} && y >= ${layout_skip_left_y} && y <= ${layout_skip_left_y} + ${layout_skip_left_h}) {
              btn_name = "SKIP_LEFT";
            } else if (x >= ${layout_skip_right_x} && x <= ${layout_skip_right_x} + ${layout_skip_right_w} && y >= ${layout_skip_right_y} && y <= ${layout_skip_right_y} + ${layout_skip_right_h}) {
              btn_name = "SKIP_RIGHT";
            }
            // --- Home - Back - Play/Pause ---
            else if (x >= ${layout_nav_back_x} && x <= ${layout_nav_back_x} + ${layout_nav_back_w} && y >= ${layout_nav_back_y} && y <= ${layout_nav_back_y} + ${layout_nav_back_h}) {
              btn_name = "NAV_BACK";
            } else if (x >= ${layout_nav_home_x} && x <= ${layout_nav_home_x} + ${layout_nav_home_w} && y >= ${layout_nav_home_y} && y <= ${layout_nav_home_y} + ${layout_nav_home_h}) {
              btn_name = "NAV_HOME";
            } else if (x >= ${layout_nav_play_x} && x <= ${layout_nav_play_x} + ${layout_nav_play_w} && y >= ${layout_nav_play_y} && y <= ${layout_nav_play_y} + ${layout_nav_play_h}) {
              btn_name = "NAV_PLAY_PAUSE";
            }
            // --- 2x4 Media App Grid ---
            else if (x >= ${layout_app_x} && x <= ${layout_app_x} + ${layout_app_columns} * ${layout_app_w} + (${layout_app_columns} - 1) * ${layout_app_gap_x} && y >= ${layout_app_y} && y <= ${layout_app_y} + ${layout_app_rows} * ${layout_app_h} + (${layout_app_rows} - 1) * ${layout_app_gap_y}) {
              int col = (x - ${layout_app_x}) / (${layout_app_w} + ${layout_app_gap_x});
              int row = (y - ${layout_app_y}) / (${layout_app_h} + ${layout_app_gap_y});
              if (col >= 0 && col < ${layout_app_columns} && row >= 0 && row < ${layout_app_rows}) {
                int idx = row * ${layout_app_columns} + col;
                const char* apps[8] = {
                  "APP_YOUTUBE", "APP_JELLYFIN", "APP_CRUNCHYROLL", "APP_PRIME_VIDEO",
                  "APP_DROPOUT", "APP_F1_TV", "APP_MAX", "APP_DISNEY_PLUS"
                };
                btn_name = apps[idx];
              }
            }

            if (strcmp(btn_name, "None") != 0) {
              ESP_LOGI("touch", "Button Pressed: %s (X=%d, Y=%d)", btn_name, x, y);
            } else {
              ESP_LOGD("touch", "Touch registered outside button bounds (X=%d, Y=%d)", x, y);
            }

    on_release:
      then:
        - lambda: |-
            if (!id(touch_active)) return;
            const int x = id(touch_start_x);
            const int y = id(touch_start_y);
            const uint32_t held_ms = millis() - id(touch_started_ms);

            // Repeatable D-pad commands already executed on initial touch
            if (id(touch_repeat_cmd) == 0) {
              // --- Navigation & Play/Pause Row ---
              if (x >= ${layout_nav_back_x} && x <= ${layout_nav_back_x} + ${layout_nav_back_w} && y >= ${layout_nav_back_y} && y <= ${layout_nav_back_y} + ${layout_nav_back_h}) {
                if (held_ms >= 500) id(shield_hold_cmd).execute("BACK", "0.5");
                else id(shield_cmd).execute("BACK");
              } else if (x >= ${layout_nav_home_x} && x <= ${layout_nav_home_x} + ${layout_nav_home_w} && y >= ${layout_nav_home_y} && y <= ${layout_nav_home_y} + ${layout_nav_home_h}) {
                if (held_ms >= 500) id(shield_hold_cmd).execute("HOME", "0.5");
                else id(shield_cmd).execute("HOME");
              } else if (x >= ${layout_nav_play_x} && x <= ${layout_nav_play_x} + ${layout_nav_play_w} && y >= ${layout_nav_play_y} && y <= ${layout_nav_play_y} + ${layout_nav_play_h}) {
                id(shield_cmd).execute("MEDIA_PLAY_PAUSE");
              } else if (x >= ${layout_nav_menu_x} && x <= ${layout_nav_menu_x} + ${layout_nav_menu_w} && y >= ${layout_nav_menu_y} && y <= ${layout_nav_menu_y} + ${layout_nav_menu_h}) {
                id(shield_cmd).execute("MENU");
              }
              // --- Mute ---
              else if (x >= ${layout_vol_mute_x} && x <= ${layout_vol_mute_x} + ${layout_vol_mute_w} && y >= ${layout_vol_mute_y} && y <= ${layout_vol_mute_y} + ${layout_vol_mute_h}) {
                id(denon_mute).execute();
              }
              // --- Skip Left - Skip Right ---
              else if (x >= ${layout_skip_left_x} && x <= ${layout_skip_left_x} + ${layout_skip_left_w} && y >= ${layout_skip_left_y} && y <= ${layout_skip_left_y} + ${layout_skip_left_h}) {
                id(shield_cmd).execute("MEDIA_REWIND");
              } else if (x >= ${layout_skip_right_x} && x <= ${layout_skip_right_x} + ${layout_skip_right_w} && y >= ${layout_skip_right_y} && y <= ${layout_skip_right_y} + ${layout_skip_right_h}) {
                id(shield_cmd).execute("MEDIA_FAST_FORWARD");
              }
              // --- 2x4 Media App Grid ---
              else if (x >= ${layout_app_x} && x <= ${layout_app_x} + ${layout_app_columns} * ${layout_app_w} + (${layout_app_columns} - 1) * ${layout_app_gap_x} && y >= ${layout_app_y} && y <= ${layout_app_y} + ${layout_app_rows} * ${layout_app_h} + (${layout_app_rows} - 1) * ${layout_app_gap_y}) {
                int col = (x - ${layout_app_x}) / (${layout_app_w} + ${layout_app_gap_x});
                int row = (y - ${layout_app_y}) / (${layout_app_h} + ${layout_app_gap_y});
                if (col >= 0 && col < ${layout_app_columns} && row >= 0 && row < ${layout_app_rows}) {
                  int idx = row * ${layout_app_columns} + col;
                  switch (idx) {
                    case 0: id(launch_app).execute("https://www.youtube.com"); break;
                    case 1: id(launch_app).execute("intent://#Intent;package=org.jellyfin.androidtv;end;"); break;
                    case 2: id(launch_app).execute("crunchyroll://"); break;
                    case 3: id(launch_app).execute("https://app.primevideo.com"); break;
                    case 4: id(launch_app).execute("vhxdropout://"); break;
                    case 5: id(launch_app).execute("intent://#Intent;package=com.formulaone.production;end;"); break;
                    case 6: id(launch_app).execute("https://play.hbomax.com"); break;
                    case 7: id(launch_app).execute("https://www.disneyplus.com"); break;
                  }
                }
              }
            }

            id(touch_active) = false;
            id(touch_repeat_cmd) = 0;
