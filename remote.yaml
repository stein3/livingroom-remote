substitutions:
  device_name: reterminal-sticky
  friendly_name: "Living Room Remote"
  shield_entity: "remote.shield"
  denon_entity: "media_player.denon_avr_x1400h"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - output.turn_on: pwr_hold
      - output.turn_on: pwr_lock
      - switch.turn_on: touch_power_enable
      - pcf8563.read_time:

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: arduino
    advanced:
      enable_idf_experimental_features: true

deep_sleep:
  id: sticky_deep_sleep
  wakeup_pin:
    number: GPIO4
    inverted: true
    mode: INPUT_PULLUP
    allow_other_uses: true

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "reTerminal-Sticky"
    password: !secret wifi_password
  output_power: 13dB      # Lowers transmit power from default 20dB down to 13dB
  power_save_mode: HIGH   # Enables modem sleep for power saving
  fast_connect: true      # Skips full scan to connect faster

captive_portal:

# =============================================================================
# Buses & Power
# =============================================================================

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

i2c:
  - id: i2c_sensor
    scl: GPIO0
    sda: GPIO1
    frequency: 400kHz
  - id: i2c_touch
    scl: GPIO2
    sda: GPIO3
    frequency: 100kHz

output:
  - platform: gpio
    pin: GPIO45
    id: pwr_hold

  - platform: gpio
    pin: GPIO46
    id: pwr_lock

  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 1200Hz

  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: charge_enable

switch:
  - platform: gpio
    pin: GPIO42
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100

light:
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s

# GT911 Touch Screen (native 800x480 coordinate space)
touchscreen:
  - platform: gt911
    i2c_id: i2c_touch
    id: sticky_touch
    interrupt_pin: GPIO21
    reset_pin: GPIO41

# =============================================================================
# Fonts & Icons
# =============================================================================

font:
  - file: "gfonts://Inter@600"
    id: font_xs
    size: 13
  - file: "gfonts://Inter@600"
    id: font_sm
    size: 16
  - file: "gfonts://Inter@700"
    id: font_md
    size: 20
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 32
    glyphs:
      - "\ue5d8" # arrow_upward
      - "\ue5db" # arrow_downward
      - "\ue5c4" # arrow_back
      - "\ue5c8" # arrow_forward
      - "\ue836" # radio_button_unchecked
      - "\ue88a" # home
      - "\ue5d2" # menu
      - "\ue037" # play_arrow
      - "\ue050" # volume_up
      - "\ue04d" # volume_down
      - "\ue04f" # volume_off
      - "\ue63c" # smart_display (YouTube)
      - "\ue02c" # movie (Jellyfin / Disney)
      - "\ue71c" # animation (Crunchyroll)
      - "\ue04a" # video_library (Prime Video)
      - "\ueb9d" # theater_comedy (Dropout)
      - "\uebe7" # sports_score (F1)
      - "\ueb7f" # tv (Max)

time:
  - platform: pcf8563
    i2c_id: i2c_sensor
    id: rtc_time
    address: 0x51
    update_interval: never
  - platform: homeassistant
    on_time_sync:
      then:
        - pcf8563.write_time:

# =============================================================================
# Sensors
# =============================================================================

sensor:
  - platform: homeassistant
    id: denon_volume
    entity_id: ${denon_entity}
    attribute: volume_level
    on_value:
      then:
        - component.update: epaper_display

  - platform: sht4x
    i2c_id: i2c_sensor
    address: 0x44
    temperature:
      name: "Living Room Temp"
      id: temp_sensor
    humidity:
      name: "Living Room Humidity"
      id: hum_sensor
    update_interval: 120s

  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      if (id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2) != esphome::i2c::ERROR_OK) return NAN;
      return static_cast<float>(static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8));

# =============================================================================
# Action Scripts
# =============================================================================

script:
  - id: beep_tap
    then:
      - light.turn_on:
          id: buzzer
          brightness: 15%
      - delay: 20ms
      - light.turn_off: buzzer

  - id: beep_double
    then:
      - light.turn_on:
          id: buzzer
          brightness: 20%
      - delay: 35ms
      - light.turn_off: buzzer
      - delay: 40ms
      - light.turn_on:
          id: buzzer
          brightness: 20%
      - delay: 35ms
      - light.turn_off: buzzer

  # Sleep Remote + Turn Off Devices
  - id: act_power_off_and_sleep
    then:
      - script.execute: beep_double
      - if:
          condition:
            lambda: "return id(shield_is_on).state;"
          then:
            - homeassistant.action:
                action: remote.turn_off
                data:
                  entity_id: ${shield_entity}
      - if:
          condition:
            lambda: "return id(denon_is_on).state;"
          then:
            - homeassistant.action:
                action: media_player.turn_off
                data:
                  entity_id: ${denon_entity}
      - delay: 250ms
      - switch.turn_off: touch_power_enable
      - deep_sleep.enter: sticky_deep_sleep

  # Shield Commands
  - id: act_shield_cmd
    parameters:
      cmd: string
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: ${shield_entity}
          data_template:
            command: !lambda "return cmd;"

  - id: act_shield_hold_cmd
    parameters:
      cmd: string
      secs: string
    then:
      - script.execute: beep_double
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: ${shield_entity}
          data_template:
            command: !lambda "return cmd;"
            hold_secs: !lambda "return secs;"

  # Denon Controls
  - id: act_denon_vol_up
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: ${denon_entity}

  - id: act_denon_vol_down
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: ${denon_entity}

  - id: act_denon_mute
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: ${denon_entity}
          data_template:
            is_volume_muted: !lambda "return !id(denon_muted).state;"

  # App Launching
  - id: launch_app
    parameters:
      activity: string
    then:
      - script.execute: beep_tap
      - homeassistant.action:
          action: remote.turn_on
          data:
            entity_id: ${shield_entity}
          data_template:
            activity: !lambda "return activity;"

# =============================================================================
# Binary Sensors (HA States, Physical Buttons, Touch Virtual Zones)
# =============================================================================

binary_sensor:
  # HA Entities
  - platform: homeassistant
    id: shield_is_on
    entity_id: ${shield_entity}

  - platform: homeassistant
    id: denon_is_on
    entity_id: ${denon_entity}

  - platform: homeassistant
    id: denon_muted
    entity_id: ${denon_entity}
    attribute: is_volume_muted
    on_state:
      then:
        - component.update: epaper_display

  # Side Buttons
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: side_btn_vol_up
    name: "Physical Vol Up"
    on_press:
      - script.execute: act_denon_vol_up

  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    id: side_btn_vol_down
    name: "Physical Vol Down"
    on_press:
      - script.execute: act_denon_vol_down

  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: side_btn_power_sleep
    name: "Power Off & Sleep"
    on_press:
      - script.execute: act_power_off_and_sleep

  # ===========================================================================
  # RIGHT PANEL TOUCH ZONES (Remote Navigation & D-Pad: x: 300 to 780)
  # ===========================================================================

  # Navigation Row (y: 65 to 135)
  - platform: touchscreen
    id: touch_back
    touchscreen_id: sticky_touch
    x_min: 300
    x_max: 440
    y_min: 65
    y_max: 135
    on_click:
      - min_length: 40ms
        max_length: 450ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "BACK"
      - min_length: 500ms
        max_length: 3000ms
        then:
          - script.execute:
              id: act_shield_hold_cmd
              cmd: "BACK"
              secs: "0.5"

  - platform: touchscreen
    id: touch_home
    touchscreen_id: sticky_touch
    x_min: 460
    x_max: 600
    y_min: 65
    y_max: 135
    on_click:
      - min_length: 40ms
        max_length: 450ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "HOME"
      - min_length: 500ms
        max_length: 3000ms
        then:
          - script.execute:
              id: act_shield_hold_cmd
              cmd: "HOME"
              secs: "0.5"

  - platform: touchscreen
    id: touch_menu
    touchscreen_id: sticky_touch
    x_min: 620
    x_max: 760
    y_min: 65
    y_max: 135
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute: beep_tap
          - homeassistant.action:
              action: remote.send_command
              data:
                entity_id: ${shield_entity}
                command: MENU
                delay_secs: "0.4"

  # D-Pad Matrix (y: 155 to 375)
  - platform: touchscreen
    id: touch_up
    touchscreen_id: sticky_touch
    x_min: 460
    x_max: 600
    y_min: 155
    y_max: 225
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "DPAD_UP"

  - platform: touchscreen
    id: touch_left
    touchscreen_id: sticky_touch
    x_min: 320
    x_max: 440
    y_min: 235
    y_max: 305
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "DPAD_LEFT"

  - platform: touchscreen
    id: touch_center
    touchscreen_id: sticky_touch
    x_min: 460
    x_max: 600
    y_min: 235
    y_max: 305
    on_click:
      - min_length: 40ms
        max_length: 450ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "DPAD_CENTER"
      - min_length: 500ms
        max_length: 3000ms
        then:
          - script.execute:
              id: act_shield_hold_cmd
              cmd: "DPAD_CENTER"
              secs: "0.5"

  - platform: touchscreen
    id: touch_right
    touchscreen_id: sticky_touch
    x_min: 620
    x_max: 740
    y_min: 235
    y_max: 305
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "DPAD_RIGHT"

  - platform: touchscreen
    id: touch_down
    touchscreen_id: sticky_touch
    x_min: 460
    x_max: 600
    y_min: 315
    y_max: 385
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "DPAD_DOWN"

  # Media & Volume Bar (y: 395 to 465)
  - platform: touchscreen
    id: touch_play_pause
    touchscreen_id: sticky_touch
    x_min: 300
    x_max: 405
    y_min: 395
    y_max: 465
    on_click:
      - min_length: 40ms
        max_length: 450ms
        then:
          - script.execute:
              id: act_shield_cmd
              cmd: "MEDIA_PLAY_PAUSE"
      - min_length: 500ms
        max_length: 3000ms
        then:
          - script.execute:
              id: act_shield_hold_cmd
              cmd: "HOME"
              secs: "0.5"

  - platform: touchscreen
    id: touch_avr_down
    touchscreen_id: sticky_touch
    x_min: 420
    x_max: 525
    y_min: 395
    y_max: 465
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute: act_denon_vol_down

  - platform: touchscreen
    id: touch_avr_up
    touchscreen_id: sticky_touch
    x_min: 540
    x_max: 645
    y_min: 395
    y_max: 465
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute: act_denon_vol_up

  - platform: touchscreen
    id: touch_avr_mute
    touchscreen_id: sticky_touch
    x_min: 660
    x_max: 765
    y_min: 395
    y_max: 465
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - script.execute: act_denon_mute

  # ===========================================================================
  # LEFT COLUMN TOUCH ZONES (8 Apps in 2x4 Grid: x: 20 to 260)
  # ===========================================================================

  # Row 0 (y: 65 to 155)
  - platform: touchscreen
    id: app_youtube
    touchscreen_id: sticky_touch
    x_min: 20
    x_max: 130
    y_min: 65
    y_max: 155
    on_press:
      - script.execute:
          id: launch_app
          activity: "com.google.android.youtube.tv"

  - platform: touchscreen
    id: app_jellyfin
    touchscreen_id: sticky_touch
    x_min: 145
    x_max: 255
    y_min: 65
    y_max: 155
    on_press:
      - script.execute:
          id: launch_app
          activity: "org.jellyfin.androidtv"

  # Row 1 (y: 168 to 258)
  - platform: touchscreen
    id: app_crunchyroll
    touchscreen_id: sticky_touch
    x_min: 20
    x_max: 130
    y_min: 168
    y_max: 258
    on_press:
      - script.execute:
          id: launch_app
          activity: "com.crunchyroll.crunchyroid"

  - platform: touchscreen
    id: app_prime
    touchscreen_id: sticky_touch
    x_min: 145
    x_max: 255
    y_min: 168
    y_max: 258
    on_press:
      - script.execute:
          id: launch_app
          activity: "com.amazon.amazonvideo.livingroom"

  # Row 2 (y: 271 to 361)
  - platform: touchscreen
    id: app_dropout
    touchscreen_id: sticky_touch
    x_min: 20
    x_max: 130
    y_min: 271
    y_max: 361
    on_press:
      - script.execute:
          id: launch_app
          activity: "com.collegehumor.chdropout"

  - platform: touchscreen
    id: app_f1
    touchscreen_id: sticky_touch
    x_min: 145
    x_max: 255
    y_min: 271
    y_max: 361
    on_press:
      - script.execute:
          id: launch_app
          activity: "com.formulaone.production"

  # Row 3 (y: 374 to 464)
  - platform: touchscreen
    id: app_hbo
    touchscreen_id: sticky_touch
    x_min: 20
    x_max: 130
    y_min: 374
    y_max: 464
    on_press:
      - script.execute:
          id: launch_app
          activity: "com.wbd.stream"

  - platform: touchscreen
    id: app_disney
    touchscreen_id: sticky_touch
    x_min: 145
    x_max: 255
    y_min: 374
    y_max: 464
    on_press:
      - script.execute:
          id: launch_app
          activity: "com.disney.disneyplus"

# =============================================================================
# E-Paper Canvas Rendering (Native 800 x 480 Hardware Grid)
# =============================================================================

display:
  - platform: epaper_spi
    id: epaper_display
    model: seeed-reterminal-sticky
    update_interval: 300s
    lambda: |-
      // --- Top Status Bar ---
      auto now = id(rtc_time).now();
      if (now.is_valid()) {
        it.strftime(20, 18, id(font_sm), COLOR_OFF, TextAlign::TOP_LEFT, "%H:%M", now);
      }
      if (id(temp_sensor).has_state()) {
        it.printf(140, 18, id(font_sm), COLOR_OFF, TextAlign::TOP_LEFT, "%.1f°C", id(temp_sensor).state);
      }

      int vol_pct = id(denon_volume).has_state() ? static_cast<int>(id(denon_volume).state * 100.0f) : 0;
      bool is_mute = id(denon_muted).state;
      if (is_mute) {
        it.printf(660, 18, id(font_sm), COLOR_OFF, TextAlign::TOP_RIGHT, "AVR: MUTED");
      } else {
        it.printf(660, 18, id(font_sm), COLOR_OFF, TextAlign::TOP_RIGHT, "AVR: %d%%", vol_pct);
      }

      if (!isnan(id(battery_level).state)) {
        it.printf(780, 18, id(font_sm), COLOR_OFF, TextAlign::TOP_RIGHT, "BAT: %.0f%%", id(battery_level).state);
      }
      it.horizontal_line(20, 46, 760, COLOR_OFF);

      // Vertical Divider separating Left App Grid from Right Remote Panel
      it.vertical_line(280, 56, 414, COLOR_OFF);

      // --- Left Column: 8 Streaming App Icon Tiles (2 cols x 4 rows) ---
      struct AppTile {
        const char* icon;
        const char* label;
      };
      const AppTile apps[8] = {
        {"\ue63c", "YouTube"},
        {"\ue02c", "Jellyfin"},
        {"\ue71c", "Crunchy"},
        {"\ue04a", "Prime"},
        {"\ueb9d", "Dropout"},
        {"\uebe7", "F1 TV"},
        {"\ueb7f", "Max"},
        {"\ue02c", "Disney+"}
      };

      for (int i = 0; i < 8; i++) {
        int col = i % 2;
        int row = i / 2;
        int ax = 20 + col * 125;
        int ay = 65 + row * 103;
        it.rectangle(ax, ay, 110, 90, COLOR_OFF);
        it.printf(ax + 55, ay + 32, id(font_icons), COLOR_OFF, TextAlign::CENTER, "%s", apps[i].icon);
        it.printf(ax + 55, ay + 68, id(font_xs), COLOR_OFF, TextAlign::CENTER, "%s", apps[i].label);
      }

      // --- Right Panel: Navigation Row (y: 65 to 135) ---
      it.rectangle(300, 65, 140, 70, COLOR_OFF);
      it.printf(370, 100, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue5c4"); // Back

      it.rectangle(460, 65, 140, 70, COLOR_OFF);
      it.printf(530, 100, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue88a"); // Home

      it.rectangle(620, 65, 140, 70, COLOR_OFF);
      it.printf(690, 100, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue5d2"); // Menu

      // --- Right Panel: D-Pad Matrix (y: 155 to 385) ---
      // Up
      it.rectangle(460, 155, 140, 70, COLOR_OFF);
      it.printf(530, 190, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue5d8");
      // Left
      it.rectangle(320, 235, 120, 70, COLOR_OFF);
      it.printf(380, 270, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue5c4");
      // Center
      it.rectangle(460, 235, 140, 70, COLOR_OFF);
      it.printf(530, 270, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue836");
      // Right
      it.rectangle(620, 235, 120, 70, COLOR_OFF);
      it.printf(680, 270, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue5c8");
      // Down
      it.rectangle(460, 315, 140, 70, COLOR_OFF);
      it.printf(530, 350, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue5db");

      // --- Right Panel: Media & Volume Controls (y: 395 to 465) ---
      it.rectangle(300, 395, 105, 70, COLOR_OFF);
      it.printf(352, 430, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue037"); // Play/Pause

      it.rectangle(420, 395, 105, 70, COLOR_OFF);
      it.printf(472, 430, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue04d"); // Vol-

      it.rectangle(540, 395, 105, 70, COLOR_OFF);
      it.printf(592, 430, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue050"); // Vol+

      it.rectangle(660, 395, 105, 70, COLOR_OFF);
      it.printf(712, 430, id(font_icons), COLOR_OFF, TextAlign::CENTER, "\ue04f"); // Mute
