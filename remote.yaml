substitutions:
  device_name: reterminal-sticky
  friendly_name: "Living Room Remote"
  shield_entity: "remote.shield"
  denon_entity: "media_player.denon_avr_x1400h"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_42);
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_hold_dis(GPIO_NUM_47);
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - switch.turn_on: touch_power_enable
        - component.update: battery_level
        - logger.log:
            format: "Battery at boot: %.0f%%"
            args: ['id(battery_level).state']
        - pcf8563.read_time:
        - delay: 500ms
        - component.update: epaper_display
    - priority: 300
      then:
        - logger.log: "Waiting for Home Assistant API connection..."
        - wait_until:
            condition:
              api.connected:
            timeout: 10s
        - if:
            condition:
              api.connected:
            then:
              - logger.log: "Home Assistant API connected and subscribed."
            else:
              - logger.log:
                  level: WARN
                  format: "HA API connection timed out. Commands may fail until connected."
    - priority: 250
      then:
        - script.execute: beep_hello
  on_shutdown:
    then:
      - switch.turn_off: touch_power_enable
      - lambda: |-
          // Keep touch and latch rails powered
          gpio_set_level(GPIO_NUM_42, 1);
          gpio_set_level(GPIO_NUM_45, 1);
          gpio_set_level(GPIO_NUM_46, 1);

          gpio_set_level(GPIO_NUM_47, 0);  // Display off
          gpio_hold_en(GPIO_NUM_42);
          gpio_hold_en(GPIO_NUM_45);
          gpio_hold_en(GPIO_NUM_46);
          gpio_hold_en(GPIO_NUM_47);
          gpio_deep_sleep_hold_en();

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "reTerminal-Sticky"
    password: !secret wifi_password
  output_power: 13dB      # Lowers transmit power from default 20dB down to 13dB
  power_save_mode: HIGH   # Enables modem sleep for power saving
  fast_connect: true      # Skips full scan to connect faster

captive_portal:

# =============================================================================
# Buses & Power
# =============================================================================

spi:
  id: display_spi
  clk_pin: GPIO13
  mosi_pin: GPIO14

i2c:
  - id: sensor_i2c
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    sda: GPIO1
    frequency: 400kHz

  - id: touch_i2c
    scl: GPIO2
    sda:
      number: GPIO3
      ignore_strapping_warning: true
    frequency: 100kHz
    scan: true

output:
  - platform: gpio
    id: pwr_hold
    pin:
      number: GPIO45
      ignore_strapping_warning: true

  - platform: gpio
    id: pwr_lock
    pin:
      number: GPIO46
      ignore_strapping_warning: true

  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 1200Hz

switch:
  - platform: gpio
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100
    pin: GPIO42

light:
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s

font:
  - file: "gfonts://Inter@600"
    id: font_xs
    size: 13
  - file: "gfonts://Inter@600"
    id: font_sm
    size: 16

# =============================================================================
# Rasterized Binary Vector Images (1-bit crisp monochrome)
# =============================================================================

image:
