json:

# =============================================================================
# Buses & Power
# =============================================================================

spi:
  id: display_spi
  clk_pin: GPIO13
  mosi_pin: GPIO14

i2c:
  - id: sensor_i2c
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    sda: GPIO1
    frequency: 400kHz

  - id: touch_i2c
    scl: GPIO2
    sda:
      number: GPIO3
      ignore_strapping_warning: true
    frequency: 100kHz
    scan: true

output:
  - platform: gpio
    id: pwr_hold
    pin:
      number: GPIO45
      ignore_strapping_warning: true

  - platform: gpio
    id: pwr_lock
    pin:
      number: GPIO46
      ignore_strapping_warning: true

  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 1200Hz

switch:
  - platform: gpio
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100
    pin: GPIO42

light:
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s

font:
  - file: "gfonts://Inter@600"
    id: font_xs
    size: 13
  - file: "gfonts://Inter@600"
    id: font_sm
    size: 16
  - file: "gfonts://Inter@600"
    id: font_md
    size: 24
  - file: "gfonts://Inter@600"
